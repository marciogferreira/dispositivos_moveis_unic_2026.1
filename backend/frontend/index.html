<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      overflow-x: hidden;
    }

    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
    }

    .sidebar a {
      color: #adb5bd;
      text-decoration: none;
      display: block;
      padding: 10px;
    }

    .sidebar a:hover {
      background-color: #495057;
      color: white;
    }

    .content {
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- MENU LATERAL -->
    <div class="col-md-2 sidebar p-3">
      <h4>Meu Sistema</h4>
      <hr>

      <a href="#">Dashboard</a>
      <a href="#">Produtos</a>
      <a href="#">Categorias</a>
      <a href="usuarios.html">Usuários</a>
      <a href="#">Pedidos</a>
    </div>

    <!-- CONTEÚDO -->
    <div class="col-md-10 content">
      <h2>Dashboard</h2>
      <p>Bem-vindo ao sistema 🚀</p>

      <div class="row">
        <div class="col-md-3">
          <div class="card text-bg-primary mb-3">
            <div class="card-body">
              <h5>Produtos</h5>
              <p>120 cadastrados</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-success mb-3">
            <div class="card-body">
              <h5>Pedidos</h5>
              <p>45 realizados</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-warning mb-3">
            <div class="card-body">
              <h5>Usuários</h5>
              <p>10 ativos</p>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

</body>
</html>
