<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avatar 3D Falante</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #ui {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
    }
    input {
      padding: 10px;
      width: 300px;
      border-radius: 8px;
      border: none;
    }
    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-left: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="ui">
  <input id="text" placeholder="Digite algo..." />
  <button onclick="falar()">Falar</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js';

// Cena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// Câmera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Luz
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

// Cabeça
const headGeometry = new THREE.SphereGeometry(1.5, 32, 32);
const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
const head = new THREE.Mesh(headGeometry, headMaterial);
scene.add(head);

// Olhos
const eyeGeometry = new THREE.SphereGeometry(0.2, 16, 16);
const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });

const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
leftEye.position.set(-0.5, 0.3, 1.2);

const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
rightEye.position.set(0.5, 0.3, 1.2);

scene.add(leftEye, rightEye);

// Boca (caixa que vai escalar)
const mouthGeometry = new THREE.BoxGeometry(0.8, 0.2, 0.1);
const mouthMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const mouth = new THREE.Mesh(mouthGeometry, mouthMaterial);
mouth.position.set(0, -0.6, 1.2);
scene.add(mouth);

// Animação
let speaking = false;

function animate() {
  requestAnimationFrame(animate);

  if (speaking) {
    mouth.scale.y = 0.2 + Math.random(); // simula fala
  } else {
    mouth.scale.y = 0.2;
  }

  renderer.render(scene, camera);
}

animate();

// Fala (TTS)
window.falar = function () {
  const text = document.getElementById("text").value;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-BR';

  utterance.onstart = () => {
    speaking = true;
  };

  utterance.onend = () => {
    speaking = false;
  };

  speechSynthesis.speak(utterance);
};

</script>

</body>
</html>
